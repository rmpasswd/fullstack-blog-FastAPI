name: Docker Image CI

on:
  push:
    branches: [ "live" ]
  workflow_dispatch:
jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Set image_tag
      run:  echo "image_tag=rmpasswd/fastapi-blog:$(date +%Y%m%d_%Hh%Mm)" >> $GITHUB_ENV
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: echo ${{env.image_tag}} && docker build . --tag ${{env.image_tag}}  --tag rmpasswd/fastapi-blog:latest
      
    - name: use  secret to login to docker hub
      uses: docker/login-action@v4
      with:
        username: ${{secrets.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_PAT}}
    
    - name: Build and push
      run:  docker push --all-tags rmpasswd/fastapi-blog
      
