name: Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Set image_tag
      run:  echo "image_tag=rmpasswd/fastapi-blog:$(date +%Y%m%d)" >> $GITHUB_ENV
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag $image_tag --tag rmpasswd/fastapi-blog:latest
      
    - name: use  secret to login to docker hub
      uses: docker/login-action@v4
      with:
        username: ${{secrets.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_PAT}}
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: |
          rmpasswd/fastapi-blog:${{env.image_tag}}
          rmpasswd/fastapi-blog:latest
